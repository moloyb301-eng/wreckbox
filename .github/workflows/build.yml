# Builds WreckBox for Windows and Android (the phone app), runs the tests, and — for tags like v0.2.0 — publishes the builds
# to the public releases repo, where the apps' update check finds them.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64    base64 of secrets/wreckbox-release.jks
#   ANDROID_KEY_PASSWORD    keystore / key password (from app/android/key.properties)
#   RELEASES_TOKEN          fine-grained token with Contents: read & write on the public releases repo
# Variables:
#   RELEASES_REPO           e.g. yourname/wreckbox-releases

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["bug-reports/**", "docs/**", "**.md"]   # screenshots from bug reports don't need a build
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
        working-directory: core

  windows:
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine (wreckbox_core.dll + wbcore.exe)
        run: cargo build --release
        working-directory: core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tests
        run: flutter test
        working-directory: app
      - name: Build app
        run: flutter build windows --release
        working-directory: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bundle engine + Soulseek sidecar (embedded Python)
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item core/target/release/wreckbox_core.dll $out/
          $slsk = "$out/soulseek"
          New-Item -ItemType Directory -Force $slsk/python | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip -OutFile py.zip
          Expand-Archive py.zip -DestinationPath $slsk/python
          # Let the embedded Python see its own site-packages.
          (Get-Content $slsk/python/python311._pth) -replace '#import site', 'import site' | Set-Content $slsk/python/python311._pth
          Add-Content $slsk/python/python311._pth 'Lib\site-packages'
          python -m pip install --no-compile --target $slsk/python/Lib/site-packages aioslsk
          Copy-Item sidecar/slsk_sync.py $slsk/
          # Smoke test: the sidecar imports and prints its help with the bundled interpreter.
          & $slsk/python/python.exe $slsk/slsk_sync.py --help | Select-Object -First 3
      - name: Smoke test — the engine analyses and tags on Windows
        shell: pwsh
        run: |
          # A generated 5 s, 120 BPM click track: analyse, write tags, read them back.
          python -c "import wave,struct,math; w=wave.open('t.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<h', int(12000*math.sin(i*0.3)) if i % 22050 < 400 else 0) for i in range(44100*20)))"
          core/target/release/wbcore.exe analyze t.wav
          '[{"path":"t.wav","title":"Smoke","artists":["CI"],"bpm":120,"key":"A minor"}]' | core/target/release/wbcore.exe write-tags
          $t = core/target/release/wbcore.exe tags t.wav
          $t
          if ($t -notmatch '"title":"Smoke"') { throw "tag round trip failed on Windows" }
      - name: Zip
        shell: pwsh
        run: |
          $v = (Select-String -Path app/pubspec.yaml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value.Split('+')[0]
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "WreckBox-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: WreckBox-*-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-ndk
      - name: Build engine for Android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cd core && cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 23 -o ../app/android/app/src/main/jniLibs build --release --lib
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Signing key
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=wreckbox\nkeyPassword=%s\n" "$RUNNER_TEMP/release.jks" "$PASS" "$PASS" > app/android/key.properties
      - name: Build APK
        run: |
          flutter build apk --release
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk ../WreckBox-$v-android.apk
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: WreckBox-*-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${{ vars.RELEASES_REPO }}" \
            --title "WreckBox ${GITHUB_REF_NAME#v}" \
            --notes "Android: open the .apk to install or update. Windows: unzip and run wreckbox.exe. All downloads (Mac too): https://wreckbox-api.moloyb301.workers.dev/download"
