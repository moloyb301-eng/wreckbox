[package]
name = "wreckbox_core"
version = "0.1.0"
edition = "2021"
description = "WreckBox engine: audio decoding, BPM / key / energy analysis and tag writing — shared by every platform"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "wbcore"
path = "src/main.rs"

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusty-chromaprint = "0.3.0"
base64 = "0.23.1"

[profile.release]
opt-level = 3
lto = true
